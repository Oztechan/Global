name: Publish Release

on:
  workflow_call:
    inputs:
      slack_channel:
        required: true
        type: string
    secrets:
      SLACK_BOT_TOKEN:
        required: true
      REPO_TOKEN:
        required: true

jobs:

  PublishRelease:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # cut the release
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      # The tag that triggered the caller already exists, so this only cuts the release for it.
      # --generate-notes fills the body from the merged pull requests.
      - name: PublishRelease
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --generate-notes

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  Notify:
    runs-on: ubuntu-26.04
    needs: [ PublishRelease ]
    if: always()
    steps:

      - name: Notify slack fail
        if: false == (needs.PublishRelease.outputs.status == 'success')
        uses: voxmedia/github-action-slack-notify-build@373da97827332b19e753c84d1e5b7937dbe0fbfa # v2
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel: ${{ inputs.slack_channel }}
          status: FAILED
          color: danger
