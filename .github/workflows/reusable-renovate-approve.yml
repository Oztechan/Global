name: Renovate Auto Approve

on:
  workflow_call:
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true

jobs:
  RenovateAutoApprove:
    # GITHUB_TOKEN cannot satisfy a code owner review, so approve as the code owner. Majors are read
    # by hand, and a push dismisses the old review, hence the approval on every synchronize.
    if: github.event.pull_request.user.login == 'renovate[bot]' && !contains(github.head_ref, 'major')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:

      - name: Approve once the required checks are green
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # `gh pr checks` exits 0 even when a check failed, and a cancelled job is not reported as a
        # failure either, so read the buckets rather than the exit code.
        run: |
          gh pr checks "$PR" --repo "$REPO" --required --watch --interval 30 || true

          if ! checks=$(gh pr checks "$PR" --repo "$REPO" --required --json bucket,name 2>&1); then
            printf '%s\n' "$checks"
            printf '%s' "$checks" | grep -q 'no required checks' || exit 1
            checks='[]'
          fi

          red=$(printf '%s' "$checks" | jq -r '[.[] | select(.bucket != "pass" and .bucket != "skipping")] | map(.name) | join(", ")')

          if [ -n "$red" ]; then
            echo "Not green, skipping the approval: $red"
            exit 0
          fi

          gh pr review "$PR" --repo "$REPO" --approve --body "All required checks passed, approving automatically."
