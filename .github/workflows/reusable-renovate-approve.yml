name: Renovate Auto Approve

on:
  workflow_call:
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true

jobs:
  RenovateAutoApprove:
    # The "all required checks are green" gate is done by the CALLER: it adds a job that `needs` its
    # CI jobs and only then calls this workflow — so there is nothing to watch or poll here, and the
    # job can never time out. This step just approves as the code owner (GITHUB_TOKEN cannot). Majors
    # are read by hand; a push dismisses the review, so the caller re-runs this on every synchronize.
    # The author/non-major check here is a safety net in case a caller forgets to guard its `if`.
    if: github.event.pull_request.user.login == 'renovate[bot]' && !contains(github.head_ref, 'major')
    runs-on: ubuntu-26.04
    steps:

      - name: Approve
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Skip if a human has pushed any commit: the PR is then a custom change to review/merge by
          # hand, not an unattended Renovate update. REST .author.type is "Bot" for Renovate and
          # "User" for a person, and (unlike gh's .authors) it is not affected by the Co-authored-by
          # trailer some renovate.json configs add, so it won't false-positive on every PR.
          human=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '[.[] | select(.author.type == "User")] | length')
          if [ "$human" != "0" ]; then
            echo "PR has $human human-authored commit(s) — treating as a custom PR, skipping auto-approval."
            exit 0
          fi

          gh pr review "$PR" --repo "$REPO" --approve --body "All required checks passed, approving automatically."
