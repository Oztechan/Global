name: Project Automations
on:
  issues:
    types:
      - opened
      - reopened
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - closed
      - converted_to_draft

jobs:
  ProjectAutomations:
    uses: Oztechan/Global/.github/workflows/reusable-project.yml@develop
    with:
      project_id: 13
    secrets: inherit

  # Auto-approve Renovate PRs once the PR workflow passes — the needs edge is the gate; the shared
  # reusable does the code-owner approval. Replaces the old standalone renovate.yml.
  RenovateAutoApprove:
    needs: [ ProjectAutomations ]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      !contains(github.head_ref, 'major')
    uses: Oztechan/Global/.github/workflows/reusable-renovate-approve.yml@9db02fc2a2698f139227fcd9bc7797f52632384e
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
